version: 2

models:
  - name: stg_official_outages
    description: >
      One row per raw.official_outages row, enriched with district resolution,
      IST timestamp parsing, duration, cause taxonomy, geocoding and estimated
      affected customers. Staging materialized as a view (contract).
    columns:
      - name: row_hash
        description: Stable content hash of the logical outage (dedupe key).
        tests:
          - not_null
      - name: batch_id
        tests:
          - not_null
      - name: schema_type
        description: circle | division (drives is_planned).
        tests:
          - not_null
          - accepted_values:
              values: ["circle", "division"]
      - name: district
        description: Resolved canonical district, or 'Unknown' when unresolvable.
        tests:
          - not_null
      - name: is_planned
        tests:
          - not_null
      - name: cause_category
        tests:
          - not_null
          - accepted_values:
              values: ["weather", "tree_trimming", "equipment_failure", "maintenance", "project_work", "line_work", "other"]
      - name: duration_minutes
        description: Parsed end - start in minutes, never negative (null if end missing).

  - name: stg_outage_events
    description: >
      Deduplicated outage history across successful batches, one row per row_hash,
      with first_seen/last_seen batch timestamps and is_active = listed in the
      latest successful batch.
    columns:
      - name: row_hash
        tests:
          - not_null
          - unique
      - name: district
        tests:
          - not_null
      - name: is_active
        tests:
          - not_null

  - name: stg_district_profile
    description: Cleaned seeds/district_profile.csv (30 canonical districts).
    columns:
      - name: district
        tests:
          - not_null
          - unique
      - name: zone
        tests:
          - not_null
      - name: customers
        tests:
          - not_null

  - name: stg_weather_hourly
    description: Cleaned raw.weather_hourly per district-hour (obs + forecast hours).
    columns:
      - name: district
        tests:
          - not_null
      - name: observed_at
        tests:
          - not_null
