name: odisha
services:
  app:
    build: ./app
    image: odisha-app:2.0.0
    container_name: odisha-app
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      ODISHA_MODE: snapshot
      DATA_DIR: /opt/odisha-data
      WEB_DIR: /app/out
      TZ: Asia/Kolkata
    volumes:
      - odisha_app_data:/opt/odisha-data:ro
    read_only: true
    cpus: 0.5
    mem_limit: 96m
    logging:
      driver: local
      options: {max-size: "1m", max-file: "2"}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/api/health"]
      interval: 2m
      timeout: 4s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  refresh:
    profiles: [manual]
    # Reuse the Python dependencies already installed on this host.
    image: odisha-airflow:2.10.5
    build:
      context: ..
      dockerfile: platform/airflow/Dockerfile
    entrypoint: ["python", "/repo/scripts/refresh_snapshot.py"]
    working_dir: /repo
    user: "0:0"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    read_only: true
    volumes:
      - ..:/repo:ro
      - odisha_app_data:/snapshot
    tmpfs:
      - /tmp:size=48m
    cpus: 0.5
    mem_limit: 384m
    restart: "no"

volumes:
  odisha_app_data:

networks:
  default:
    name: odisha_net
